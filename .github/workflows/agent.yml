name: JARVIS Telegram Agent

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-agent
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run agent
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          DAHL_KEY: ${{ secrets.DAHL_KEY }}
        run: python bot.py

      - name: Persist conversation state
        run: |
          git config user.name "jarvis-agent"
          git config user.email "jarvis@agents.local"
          git add state.json
          git diff --cached --quiet || (git commit -m "state sync [skip ci]" && git push)
